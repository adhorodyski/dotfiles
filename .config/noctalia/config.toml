[bar.default]
background_opacity = 0.8
center = []
end = [ "temp", "cpu", "ram", "spacer_4", "bluetooth", "network", "spacer_3", "date", "clock" ]
font_family = "Inter"
margin_edge = 0
margin_ends = 0
radius = 0
scale = 0.9
shadow = false
start = [ "control-center", "spacer_2", "active_window" ]
thickness = 28

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[desktop_widgets]
enabled = false

[keybinds]
cancel = [ "Escape" ]
down = [ "Down" ]
left = [ "Left" ]
right = [ "Right" ]
up = [ "Up" ]
validate = [ "Return" ]

[location]
address = "Nowy Sacz, Poland"
auto_locate = true

[lockscreen_widgets]
enabled = false

[nightlight]
enabled = true

[shell]
app_icon_color = "surface"
font_family = "JetBrainsMono NF"

    [shell.animation]
    speed = 0.8

    [shell.panel]
    control_center_placement = "floating"
    launcher_categories = false
    launcher_session_search = true
    session_placement = "floating"
    shadow = false
    wallpaper_placement = "floating"

[theme]
builtin = "Kanagawa"
community_palette = "Kanagawa Dragon"
source = "wallpaper"
wallpaper_scheme = "muted"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper.default]
path = "/home/adhorodyski/Pictures/Wallpapers/nix-wallpaper-binary-black.png"

[wallpaper.monitors.HDMI-A-3]
path = "/home/adhorodyski/Pictures/Wallpapers/a_white_light_pole_with_a_jet_trail_in_the_sky.jpg"

[widget.active_window]
display = "text_only"
title_scroll = "always"

[widget.control-center]
glyph = "terminal-2"
scale = 1.15

[widget.cpu]
display = "text"

[widget.date]
format = "{:%a %b %d}"

[widget.network]
show_label = false

[widget.ram]
display = "text"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.sysmon]
display = "text"

[widget.temp]
display = "text"
show_label = false

[widget.workspaces]
display = "none"
scale = 0.6
